eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true


management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

 

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-3hhiknrjf4pxyrot.us.auth0.com/
